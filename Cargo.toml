[workspace]
resolver = "2"
members = [
    "crates/compsync_core",
    "crates/compsync_watcher",
    "crates/compsync_network",
    "crates/compsync_cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CompSync Developers"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
